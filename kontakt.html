<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Računalne komponente - Kontakt</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

<header class="bg-slate-900 text-white">
  
  <div class="max-w-6xl mx-auto px-4 py-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
   
    <h1 class="text-2xl font-bold">Računalne komponente</h1>
   
    <nav class="flex gap-2">
      <a href="index.html" class="px-4 py-2 rounded hover:bg-slate-700">Početna</a>
      <a href="usluge.html" class="px-4 py-2 rounded hover:bg-slate-700">Usluge</a>
      <a href="kontakt.html" class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-500">Kontakt</a>
    </nav>

  </div>

</header>

<main class="max-w-5xl mx-auto px-4 py-12">

  <h2 class="text-4xl font-bold text-center mb-8">Kontakt</h2>

  <section class="grid grid-cols-1 md:grid-cols-2 gap-8">
    
    <div class="bg-white rounded-xl shadow p-6">
      <h3 class="text-xl font-bold mb-4">Kontakt podaci</h3>
      <p class="mb-2"><strong>Email:</strong> info@racunalnekomponente.hr</p>
      <p class="mb-2"><strong>Telefon:</strong> 099 123 4567</p>
      <p><strong>Radno vrijeme:</strong> pon - pet, 8:00 - 16:00</p>
    </div>

    <form class="bg-white rounded-xl shadow p-6">
      <input type="text" placeholder="Ime i prezime" class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-4 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-300">
      <input type="email" placeholder="Email" class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-4 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-300">
      <textarea rows="4" placeholder="Poruka" class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-4 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-300"></textarea>
      <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-500">Pošalji poruku</button>
    </form>
  </section>
</main>

<footer class="bg-slate-900 text-white text-center py-6">
  <p>&copy; 2026 Računalne komponente</p>
</footer>

</body>
</html>
